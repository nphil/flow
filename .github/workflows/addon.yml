name: Add-on

# flow_web is the Home Assistant app (add-on) that serves the same bundle as the integration.
# Its Dockerfile downloads flow.tar.gz from a published release, so the image is built against
# the newest release that exists. flow_web/config.yaml is bumped before its release is
# published, and building that version here would fail until the release workflow has finished.
# The weekly run also catches a removed base image or a release asset that went missing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addon-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint app config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # frenck/action-addon-linter was renamed to action-app-linter when Home Assistant renamed
      # add-ons to apps.
      - name: Lint the app
        uses: frenck/action-app-linter@v2
        with:
          path: ./flow_web

  image:
    name: Build image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Find the newest release with a flow.tar.gz
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq '
            [.[] | select(.draft | not) | select(.prerelease | not)
                 | select(any(.assets[]; .name == "flow.tar.gz"))][0].tag_name // empty')
          if [ -z "$tag" ]; then
            echo "::error::No published release carries a flow.tar.gz for the add-on image to download"
            exit 1
          fi
          echo "Building the add-on against $tag"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build the add-on image
        env:
          BUILD_VERSION: ${{ steps.release.outputs.version }}
        run: docker build --build-arg "BUILD_VERSION=$BUILD_VERSION" --tag flow-web:ci flow_web

      - name: Smoke test the image
        run: scripts/smoke-test-image.sh flow-web:ci
