name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build shared package
        run: yarn workspace @flow/shared build

      - name: Build transpiler package
        run: yarn workspace @flow/transpiler build

      - name: Build frontend
        run: yarn workspace @flow/frontend build

      - name: Verify www directory was created
        run: |
          ls -la custom_components/flow/
          ls -la custom_components/flow/www/ || echo "www directory missing!"
          ls -la custom_components/flow/www/assets/ || echo "assets directory missing!"

      - name: Create release archives
        run: |
          # Create zip with files at root (for HACS)
          cd custom_components/flow
          zip -r ../../flow.zip . -x "*.DS_Store" "*/.DS_Store"

          # Create alternative tar.gz
          tar -czf ../../flow.tar.gz --exclude="*.DS_Store" .
          cd ../..

          echo "Created archives:"
          ls -la *.zip *.tar.gz

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            flow.zip
            flow.tar.gz
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push standalone image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker build -t "ghcr.io/${{ github.repository_owner }}/flow:${VERSION}" \
                       -t "ghcr.io/${{ github.repository_owner }}/flow:latest" .
          docker push "ghcr.io/${{ github.repository_owner }}/flow:${VERSION}"
          docker push "ghcr.io/${{ github.repository_owner }}/flow:latest"
