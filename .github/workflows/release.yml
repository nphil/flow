name: Release

# To release: node scripts/bump-version.mjs 1.3.0, commit, then push the tag v1.3.0. This workflow
# checks that the version files and the tag agree, runs CI, packages flow.zip and flow.tar.gz,
# creates the GitHub Release (notes come from the commit history), and pushes the
# ghcr.io/<owner>/flow image. HACS and the add-on pick the release up from there.
#
# Rehearse without publishing anything (dry_run is on by default), from the branch you want to ship:
#   gh workflow run release.yml --ref <branch> -f version=1.3.0
# It builds and tests everything and keeps flow.zip, flow.tar.gz and the release notes as a
# workflow artifact. A dispatched run builds the commit it was started on.
#
# A release made by hand in the GitHub UI is handled too: the same workflow attaches the files
# to it and leaves its title and notes alone.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v (for example 1.3.0)
        required: true
        type: string
      dry_run:
        description: Build and test everything but publish nothing
        type: boolean
        default: true

permissions:
  contents: read

# One run per release at a time. Runs queue instead of cancelling each other, because stopping a
# publish half way would leave a release without its files.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publish: ${{ steps.plan.outputs.publish }}
      skip: ${{ steps.duplicate.outputs.skip }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Work out what to release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_dispatch)
              tag="v${INPUT_VERSION#v}"
              if [ "$INPUT_DRY_RUN" = true ]; then publish=false; else publish=true; fi
              ;;
            release)
              tag="$RELEASE_TAG"
              publish=true
              ;;
            *)
              tag="$REF_NAME"
              publish=true
              ;;
          esac

          # manifest.json, flow_web/config.yaml and the add-on Dockerfile must all say this version.
          node scripts/bump-version.mjs --check "$tag"

          version="${tag#v}"
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac

          # A dispatched release is built from the commit the run started on. If its tag already
          # exists it has to point there, or the files would not match the source of that tag.
          if [ "$EVENT" = workflow_dispatch ] && [ "$publish" = true ] \
            && git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
            tagged=$(git rev-list -n 1 "$tag")
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$tag points at ${tagged:0:7} but this run is on ${GITHUB_SHA:0:7}. Run the workflow from the tag, or delete the tag first."
              exit 1
            fi
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release $tag"
            echo
            echo "- event: \`$EVENT\`"
            echo "- publishes: \`$publish\`$([ "$publish" = true ] || echo ' (dry run: nothing is created or pushed)')"
            echo "- pre-release: \`$prerelease\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Creating a release together with a new tag fires the tag-push trigger as well as this one.
      # The tag-push run does the work, so this run stands down when it exists.
      - name: Stand down if the tag-push run handles this release
        id: duplicate
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=push&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_branch == \"$TAG\" and .conclusion != \"cancelled\")] | length")
          if [ "$runs" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "The tag push for $TAG already runs this workflow and attaches the files, so this run has nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  ci:
    name: CI
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    name: Package
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # CI built and tested custom_components/flow (the integration plus its www bundle). The
      # release ships that exact folder, with its files at the root of both archives.
      - name: Download the integration built by CI
        uses: actions/download-artifact@v8
        with:
          name: flow
          path: build/flow

      - name: Create flow.zip and flow.tar.gz
        run: |
          set -euo pipefail
          mkdir release
          out="$PWD/release"
          cd build/flow
          zip -qr "$out/flow.zip" . -x '*.DS_Store' '*/.DS_Store'
          tar -czf "$out/flow.tar.gz" --exclude='*.DS_Store' .
          ls -l "$out"

      # HACS reads flow.zip (hacs.json) and the add-on image extracts www/ from flow.tar.gz.
      - name: Verify the archives
        run: |
          set -euo pipefail
          zip_files=$(unzip -Z1 release/flow.zip)
          tar_files=$(tar -tzf release/flow.tar.gz)
          for member in manifest.json __init__.py www/index.html; do
            grep -Fxq "$member" <<< "$zip_files" || { echo "::error::flow.zip has no $member at its root"; exit 1; }
            grep -Fxq "./$member" <<< "$tar_files" || { echo "::error::flow.tar.gz has no ./$member"; exit 1; }
          done
          shipped=$(unzip -p release/flow.zip manifest.json | jq -r .version)
          if [ "$shipped" != "$VERSION" ]; then
            echo "::error::flow.zip carries manifest version $shipped, but this release is $VERSION"
            exit 1
          fi
          wanted=$(jq -r .filename hacs.json)
          if [ ! -f "release/$wanted" ]; then
            echo "::error::hacs.json asks HACS for $wanted, which this release does not build"
            exit 1
          fi

      - name: Write the release notes
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs "$TAG" > release/release-notes.md
          {
            echo "### Release notes for $TAG"
            echo
            cat release/release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the release files
        uses: actions/upload-artifact@v7
        with:
          name: flow-release
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: [prepare, package]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          name: flow-release
          path: release

      # `gh release create` publishes only after the files are uploaded, so the release is never
      # visible without them. An existing release keeps its title and notes, and its files are
      # replaced, which makes a re-run safe.
      - name: Create or update the GitHub Release
        run: |
          set -euo pipefail
          existing=$(gh release list --limit 200 --json tagName --jq '.[].tagName')
          if grep -Fxq "$TAG" <<< "$existing"; then
            echo "Release $TAG exists: replacing its files, leaving its title and notes alone."
            gh release upload "$TAG" release/flow.zip release/flow.tar.gz --clobber
          else
            flags=(--title "Flow $TAG" --notes-file release/release-notes.md --target "$GITHUB_SHA")
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$TAG" release/flow.zip release/flow.tar.gz "${flags[@]}"
          fi

      - name: Verify the release
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for asset in flow.zip flow.tar.gz; do
            grep -Fxq "$asset" <<< "$assets" || { echo "::error::Release $TAG has no $asset"; exit 1; }
          done
          echo "Release $TAG: $(gh release view "$TAG" --json url --jq .url)" | tee -a "$GITHUB_STEP_SUMMARY"

  image:
    name: Container image
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the release files
        uses: actions/download-artifact@v8
        with:
          name: flow-release
          path: release

      # The root Dockerfile copies custom_components/flow/www. Taking it from flow.tar.gz makes the
      # image hold exactly the bytes of the release asset.
      - name: Unpack the bundle for the Dockerfile
        run: |
          mkdir -p custom_components/flow
          tar -xzf release/flow.tar.gz -C custom_components/flow ./www

      - name: Build the image
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flow"
          tags=(--tag "$image:$VERSION")
          # latest follows the highest stable release, so neither a pre-release nor a re-run of an
          # old release can move it.
          if [ "$PRERELEASE" != true ]; then
            others=$(gh release list --limit 200 --json tagName,isPrerelease,isDraft \
              --jq '.[] | select((.isPrerelease or .isDraft) | not) | .tagName' | sed 's/^v//')
            highest=$({ printf '%s\n' "$VERSION"; printf '%s\n' "$others"; } | sort -V | tail -n 1)
            if [ "$highest" = "$VERSION" ]; then tags+=(--tag "$image:latest"); fi
          fi
          docker build "${tags[@]}" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            .
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "Built $image with tags: ${tags[*]//--tag /}"

      - name: Smoke test the image
        run: scripts/smoke-test-image.sh "$IMAGE:$VERSION"

      - name: Log in to GHCR
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push the image
        if: needs.prepare.outputs.publish == 'true'
        run: |
          set -euo pipefail
          docker push --all-tags "$IMAGE"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
