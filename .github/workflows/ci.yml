name: CI

# The gate for every change: runs on pushes to main and on pull requests, and release.yml calls
# it again (workflow_call) before it packages anything, so a tag can only ship what CI accepts.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to a branch or pull request replaces the run in progress. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Typecheck, lint, format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint:biome

      - name: Format check
        run: yarn format:check

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      # The frontend and transpiler tests import @flow/shared and @flow/transpiler through their
      # built dist/ folders, which do not exist on a fresh checkout.
      - name: Build the libraries the tests import
        run: yarn turbo run build --filter=@flow/transpiler

      # The round-trip corpus has its own step below, so a failing fixture is reported there.
      - name: Unit tests
        run: yarn test --run --exclude '**/ha-roundtrip-corpus.test.ts'

      # Runs even when the unit tests fail, so one run reports both.
      - name: Round-trip fixtures
        if: ${{ !cancelled() }}
        run: yarn test:roundtrip

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      # Builds every package and copies the frontend into custom_components/flow/www, which is
      # what HACS and the container images ship.
      - name: Build all packages and the Home Assistant bundle
        run: yarn build:ha

      - name: Check the Home Assistant bundle
        run: |
          www=custom_components/flow/www
          if [ ! -f "$www/index.html" ]; then
            echo "::error::$www/index.html is missing, so the frontend build did not reach the integration"
            exit 1
          fi
          if [ -z "$(ls -A "$www/assets" 2>/dev/null)" ]; then
            echo "::error::$www/assets is missing or empty"
            exit 1
          fi
          echo "Bundle is complete: $(find "$www" -type f | wc -l) files, $(du -sh "$www" | cut -f1)"

      # release.yml packages exactly this folder into flow.zip and flow.tar.gz. On pull requests it
      # is a ready-to-try build of the integration.
      - name: Upload the integration
        uses: actions/upload-artifact@v7
        with:
          name: flow
          path: custom_components/flow/
          if-no-files-found: error
          retention-days: 30
