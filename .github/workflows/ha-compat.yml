name: HA compatibility

# Runs the integration's tests against the current stable Home Assistant and against the beta.
# The beta leg fails here about a week before a breaking Home Assistant release reaches the house.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (HA ${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install Home Assistant and its test harness
        run: |
          uv venv -p 3.14
          python3 -c "import json,glob; [print(r) for f in glob.glob('custom_components/*/manifest.json') for r in json.load(open(f)).get('requirements', [])]" > manifest-requirements.txt
          prerelease=""
          if [ "${{ matrix.channel }}" = "beta" ]; then prerelease="--prerelease=allow"; fi
          uv pip install $prerelease "pytest-homeassistant[bluetooth]" -r manifest-requirements.txt -r requirements_test.txt
      - run: uv run --no-project pytest
