name: HACS Validation

# Checks the integration the way HACS and Home Assistant will: the HACS action, hassfest, and one
# version across every file a release has to keep in step. Also runs every night, because both
# validators change on their own schedule and a green main can go red without a commit.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hacs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
          # This workflow only has read access, so it cannot comment on the pull request.
          comment: 'false'

  hassfest:
    name: hassfest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: hassfest
        uses: home-assistant/actions/hassfest@master

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # manifest.json (HACS), flow_web/config.yaml (add-on) and the add-on Dockerfile have to agree.
      - name: Check the version files agree
        run: node scripts/bump-version.mjs --check
