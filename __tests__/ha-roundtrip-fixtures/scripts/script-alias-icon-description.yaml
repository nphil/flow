# Script identity: alias, icon and description.
alias: Fixture - script identity
icon: mdi:lightbulb-on
description: Turns the hallway light on for a minute.
mode: single
sequence:
  - action: light.turn_on
    target:
      entity_id: light.hallway
  - delay:
      minutes: 1
  - action: light.turn_off
    target:
      entity_id: light.hallway
