# A script with inline condition steps gating the rest.
alias: Fixture - script condition gates
mode: single
sequence:
  - condition: state
    entity_id: input_boolean.guest_mode
    state: "off"
  - action: light.turn_on
    target:
      entity_id: light.hallway
  - condition: numeric_state
    entity_id: sensor.room_a_temp
    below: 28
  - action: persistent_notification.create
    data:
      message: Both gates passed.
