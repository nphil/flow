# Nested ifs where both levels converge into a shared step, then another shared step.
id: fixture_deep_nested_converge
alias: Fixture - nested ifs converging twice
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - if:
      - condition: state
        entity_id: sun.sun
        state: below_horizon
    then:
      - if:
          - condition: state
            entity_id: input_boolean.guest_mode
            state: "on"
        then:
          - action: light.turn_on
            target:
              entity_id: light.living_room
        else:
          - action: light.turn_on
            target:
              entity_id: light.hallway
      - action: persistent_notification.create
        data:
          message: Inner decision done.
    else:
      - action: persistent_notification.create
        data:
          message: Daylight.
  - action: persistent_notification.create
    data:
      message: Outer decision done.
mode: single
