# A condition step inside a choose branch followed by more steps in that branch.
id: fixture_inline_condition_in_choose
alias: Fixture - inline condition inside choose
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: input_boolean.guest_mode
            state: "off"
        sequence:
          - condition: time
            after: "18:00:00"
          - action: light.turn_on
            target:
              entity_id: light.hallway
    default:
      - action: light.turn_off
        target:
          entity_id: light.hallway
  - action: persistent_notification.create
    data:
      message: Runs after the choose either way.
mode: single
