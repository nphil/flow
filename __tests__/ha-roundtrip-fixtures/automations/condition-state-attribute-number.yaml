# Root condition: attribute compared with a numeric value.
id: fixture_condition_state_attribute_number
alias: Fixture - state condition attribute number
triggers:
  - trigger: time
    at: "22:00:00"
conditions:
  - condition: state
    entity_id: light.kitchen
    attribute: brightness
    state: 255
actions:
  - action: persistent_notification.create
    data:
      message: Kitchen light is at full brightness.
mode: single
