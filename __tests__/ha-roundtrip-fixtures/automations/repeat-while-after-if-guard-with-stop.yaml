# A guard `if ... then stop` followed by a repeat-while loop.
id: fixture_guard_then_repeat_while
alias: Fixture - if guard then repeat while
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "off"
actions:
  - if:
      - condition: state
        entity_id: lock.front_door
        state: locked
    then:
      - stop: Already locked.
  - repeat:
      while:
        - condition: state
          entity_id: lock.front_door
          state: unlocked
        - condition: template
          value_template: "{{ repeat.index <= 5 }}"
      sequence:
        - action: lock.lock
          target:
            entity_id: lock.front_door
        - delay:
            seconds: 10
  - action: persistent_notification.create
    data:
      message: Lock routine finished.
mode: single
