# A disabled choose block between two enabled steps.
id: fixture_disabled_choose
alias: Fixture - disabled choose
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - action: persistent_notification.create
    data:
      message: Before.
  - enabled: false
    choose:
      - conditions:
          - condition: state
            entity_id: sun.sun
            state: below_horizon
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.hallway
    default:
      - action: light.turn_off
        target:
          entity_id: light.hallway
  - action: persistent_notification.create
    data:
      message: After.
mode: single
