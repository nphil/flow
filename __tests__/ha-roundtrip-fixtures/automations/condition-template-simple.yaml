# Root condition: a single-line template condition.
id: fixture_condition_template
alias: Fixture - template condition
triggers:
  - trigger: time
    at: "22:00:00"
conditions:
  - condition: template
    value_template: "{{ (state_attr('device_tracker.phone_a', 'battery_level') | int(0)) > 50 }}"
actions:
  - action: persistent_notification.create
    data:
      message: Battery is fine.
mode: single
