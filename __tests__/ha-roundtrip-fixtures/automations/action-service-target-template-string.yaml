# Service call whose whole target is one template.
id: fixture_action_target_template_string
alias: Fixture - target as template string
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - action: light.turn_on
    target: "{{ {'entity_id': ['light.hallway', 'light.porch']} }}"
mode: single
