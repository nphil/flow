# `if` using a trigger condition and a purpose-specific zone condition.
id: fixture_if_trigger_zone
alias: Fixture - if with trigger and zone conditions
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
    id: door
  - trigger: time
    at: "22:00:00"
    id: bedtime
actions:
  - if:
      - condition: trigger
        id: door
      - condition: zone.in_zone
        target:
          entity_id: person.alex
        options:
          zone: zone.home
    then:
      - action: light.turn_on
        target:
          entity_id: light.hallway
mode: single
