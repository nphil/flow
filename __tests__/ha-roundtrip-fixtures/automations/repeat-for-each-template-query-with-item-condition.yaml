# repeat.for_each over a template query, with a condition on repeat.item inside.
id: fixture_repeat_for_each_query
alias: Fixture - for_each template query
triggers:
  - trigger: time
    at: "23:00:00"
actions:
  - repeat:
      for_each: "{{ states.light | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}"
      sequence:
        - if:
            - condition: template
              value_template: "{{ repeat.item != 'light.porch' }}"
          then:
            - action: light.turn_off
              target:
                entity_id: "{{ repeat.item }}"
mode: single
