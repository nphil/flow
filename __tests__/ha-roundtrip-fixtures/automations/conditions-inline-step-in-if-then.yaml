# A condition step inside `then`: when it fails it only ends the `then` branch, the step after the `if` still runs.
id: fixture_inline_condition_in_then
alias: Fixture - inline condition inside then
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - if:
      - condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
    then:
      - condition: numeric_state
        entity_id: sensor.room_a_temp
        below: 28
      - action: light.turn_on
        target:
          entity_id: light.hallway
  - action: persistent_notification.create
    data:
      message: Runs after the if block either way.
mode: single
