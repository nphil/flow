# Time trigger with a list mixing fixed times and a helper entity.
id: fixture_trigger_time_list
alias: Fixture - time trigger list
triggers:
  - trigger: time
    at:
      - "06:00:00"
      - "18:00:00"
      - input_datetime.alarm_time
actions:
  - action: persistent_notification.create
    data:
      message: Scheduled time reached.
mode: single
