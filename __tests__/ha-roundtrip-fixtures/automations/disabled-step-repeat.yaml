# A disabled repeat block between two enabled steps.
id: fixture_disabled_repeat
alias: Fixture - disabled repeat
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - action: persistent_notification.create
    data:
      message: Before.
  - enabled: false
    repeat:
      count: 3
      sequence:
        - action: light.toggle
          target:
            entity_id: light.hallway
        - delay:
            seconds: 1
  - action: persistent_notification.create
    data:
      message: After.
mode: single
