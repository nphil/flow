# Root condition: and containing or containing not (three levels deep).
id: fixture_condition_nested_three
alias: Fixture - nested and or not
triggers:
  - trigger: time
    at: "22:00:00"
conditions:
  - condition: and
    conditions:
      - condition: or
        conditions:
          - condition: state
            entity_id: binary_sensor.motion_a
            state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: binary_sensor.motion_b
                state: "off"
              - condition: numeric_state
                entity_id: sensor.room_a_temp
                above: 30
      - condition: template
        value_template: "{{ now().hour >= 20 }}"
actions:
  - action: light.turn_on
    target:
      entity_id: light.hallway
mode: single
