# Root condition: automation only continues for one trigger id.
id: fixture_condition_trigger_id
alias: Fixture - trigger condition single id
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
    id: door
  - trigger: time
    at: "22:00:00"
    id: bedtime
conditions:
  - condition: trigger
    id: door
actions:
  - action: light.turn_on
    target:
      entity_id: light.hallway
mode: single
