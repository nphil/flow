# A disabled scene step between two enabled steps.
id: fixture_disabled_scene
alias: Fixture - disabled scene step
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - action: light.turn_on
    target:
      entity_id: light.hallway
  - enabled: false
    scene: scene.movie_night
  - action: persistent_notification.create
    data:
      message: Done.
mode: single
