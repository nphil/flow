# A wait with timeout followed by an `if` on `wait.completed` (the timeout idiom).
id: fixture_wait_completed_branch
alias: Fixture - branch on wait.completed
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - wait_template: "{{ is_state('binary_sensor.entrance', 'on') }}"
    timeout: 10
  - if:
      - "{{ not wait.completed }}"
    then:
      - action: persistent_notification.create
        data:
          message: The entrance never opened.
    else:
      - action: light.turn_on
        target:
          entity_id: light.hallway
mode: single
