# Time trigger that fires an offset before the time held by an entity.
id: fixture_trigger_time_offset
alias: Fixture - time trigger entity with offset
triggers:
  - trigger: time
    at:
      entity_id: input_datetime.alarm_time
      offset: "-00:30:00"
actions:
  - action: light.turn_on
    target:
      entity_id: light.bedroom
mode: single
