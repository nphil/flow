# Root condition whose `enabled` is a limited template evaluated at load time.
id: fixture_condition_enabled_template
alias: Fixture - condition enabled template
trigger_variables:
  strictness: 30
triggers:
  - trigger: time
    at: "22:00:00"
conditions:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
    enabled: "{{ strictness < 50 }}"
actions:
  - action: light.turn_on
    target:
      entity_id: light.hallway
mode: single
