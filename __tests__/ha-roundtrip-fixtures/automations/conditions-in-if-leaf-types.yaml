# `if` with several leaf condition types (state, numeric_state, template, time) and an else branch.
id: fixture_if_leaf_conditions
alias: Fixture - if with leaf conditions
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - if:
      - condition: state
        entity_id: input_boolean.guest_mode
        state: "off"
      - condition: numeric_state
        entity_id: sensor.room_a_temp
        below: 28
      - condition: template
        value_template: "{{ now().hour >= 20 }}"
      - condition: time
        after: "18:00:00"
        before: "23:00:00"
    then:
      - action: light.turn_on
        target:
          entity_id: light.hallway
    else:
      - action: light.turn_off
        target:
          entity_id: light.hallway
mode: single
