# A disabled if/then/else block between two enabled steps.
id: fixture_disabled_if
alias: Fixture - disabled if
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - action: persistent_notification.create
    data:
      message: Before.
  - enabled: false
    if:
      - condition: state
        entity_id: sun.sun
        state: below_horizon
    then:
      - action: light.turn_on
        target:
          entity_id: light.hallway
    else:
      - action: light.turn_off
        target:
          entity_id: light.hallway
  - action: persistent_notification.create
    data:
      message: After.
mode: single
