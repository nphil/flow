# An else-if ladder whose rungs contain waits, delays and a stop, followed by shared steps.
id: fixture_deep_ladder
alias: Fixture - if ladder with waits and stops
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - if:
      - condition: state
        entity_id: input_boolean.guest_mode
        state: "on"
    then:
      - action: persistent_notification.create
        data:
          message: Guest mode, doing nothing.
      - stop: Guest mode active.
    else:
      - if:
          - condition: state
            entity_id: sun.sun
            state: below_horizon
        then:
          - action: light.turn_on
            target:
              entity_id: light.hallway
          - wait_for_trigger:
              - trigger: state
                entity_id: binary_sensor.front_door
                to: "off"
            timeout:
              minutes: 5
            continue_on_timeout: true
          - action: light.turn_off
            target:
              entity_id: light.hallway
        else:
          - delay:
              seconds: 10
          - action: persistent_notification.create
            data:
              message: Daytime visit.
  - action: persistent_notification.create
    data:
      message: Shared tail.
mode: single
