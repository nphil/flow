# Structure stress: an if/else inside one parallel branch, then a shared step after the parallel.
id: fixture_structure_if_in_parallel
alias: Fixture - if inside parallel branch
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - parallel:
      - sequence:
          - if:
              - condition: state
                entity_id: sun.sun
                state: below_horizon
            then:
              - action: light.turn_on
                target:
                  entity_id: light.hallway
            else:
              - action: light.turn_off
                target:
                  entity_id: light.hallway
          - delay:
              seconds: 5
      - action: notify.mobile_app_phone
        data:
          message: Door opened.
  - action: persistent_notification.create
    data:
      message: Shared step.
