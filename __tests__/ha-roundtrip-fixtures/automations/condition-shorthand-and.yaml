# Root condition: `and:` shorthand (no `condition:` key).
id: fixture_condition_shorthand_and
alias: Fixture - and shorthand
triggers:
  - trigger: time
    at: "22:00:00"
conditions:
  - and:
      - condition: state
        entity_id: device_tracker.phone_a
        state: home
      - condition: numeric_state
        entity_id: sensor.room_a_temp
        below: 20
actions:
  - action: climate.turn_on
    target:
      entity_id: climate.living_room
mode: single
