# wait_for_trigger holding one trigger mapping instead of a list.
id: fixture_wait_trigger_single
alias: Fixture - wait_for_trigger single mapping
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - wait_for_trigger:
      trigger: state
      entity_id: binary_sensor.front_door
      to: "off"
  - action: light.turn_off
    target:
      entity_id: light.hallway
mode: single
