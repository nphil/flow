# Two independent ifs back to back, then a shared final step.
id: fixture_if_back_to_back
alias: Fixture - two ifs in a row
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - if:
      - condition: state
        entity_id: sun.sun
        state: below_horizon
    then:
      - action: light.turn_on
        target:
          entity_id: light.hallway
  - if:
      - condition: state
        entity_id: input_boolean.guest_mode
        state: "on"
    then:
      - action: persistent_notification.create
        data:
          message: Guest mode is on.
    else:
      - action: persistent_notification.create
        data:
          message: Guest mode is off.
  - action: persistent_notification.create
    data:
      message: Shared final step.
mode: single
