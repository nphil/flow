# parallel inside a choose branch.
id: fixture_parallel_in_choose
alias: Fixture - parallel in choose
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: sun.sun
            state: below_horizon
        sequence:
          - parallel:
              - action: light.turn_on
                target:
                  entity_id: light.hallway
              - action: notify.mobile_app_phone
                data:
                  message: Door opened after dark.
    default:
      - action: notify.mobile_app_phone
        data:
          message: Door opened.
mode: single
