# wait_template with a timeout given as a bare number of seconds.
id: fixture_wait_template_timeout_number
alias: Fixture - wait_template timeout number
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - wait_template: "{{ is_state('binary_sensor.entrance', 'on') }}"
    timeout: 30
  - action: light.turn_on
    target:
      entity_id: light.hallway
mode: single
