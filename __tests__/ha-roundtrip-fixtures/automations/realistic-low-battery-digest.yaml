# Realistic: a daily digest of low batteries built with a template list and a for_each loop.
id: fixture_realistic_battery_digest
alias: Fixture - low battery digest
triggers:
  - trigger: time
    at: "09:00:00"
actions:
  - variables:
      low_batteries: >-
        {{ states.sensor
           | selectattr('attributes.device_class', 'defined')
           | selectattr('attributes.device_class', 'eq', 'battery')
           | rejectattr('state', 'in', ['unavailable', 'unknown'])
           | selectattr('state', 'lt', '20')
           | map(attribute='entity_id') | list }}
  - if:
      - condition: template
        value_template: "{{ low_batteries | count > 0 }}"
    then:
      - repeat:
          for_each: "{{ low_batteries }}"
          sequence:
            - action: notify.mobile_app_phone
              data:
                message: "Low battery: {{ state_attr(repeat.item, 'friendly_name') }}"
            - delay:
                seconds: 2
mode: single
