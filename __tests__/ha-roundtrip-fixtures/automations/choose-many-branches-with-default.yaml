# choose with four branches and a default, each branch with several steps.
id: fixture_choose_many
alias: Fixture - choose many branches with default
triggers:
  - trigger: state
    entity_id: input_select.house_mode
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: Home
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.hallway
          - action: climate.turn_on
            target:
              entity_id: climate.living_room
      - conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: Away
        sequence:
          - action: light.turn_off
            target:
              entity_id: all
      - conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: Night
        sequence:
          - action: light.turn_off
            target:
              entity_id: light.living_room
          - delay:
              seconds: 30
          - action: light.turn_off
            target:
              entity_id: light.hallway
      - conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: Guest
        sequence:
          - action: persistent_notification.create
            data:
              message: Guest mode started.
    default:
      - action: persistent_notification.create
        data:
          message: Unknown house mode.
mode: single
