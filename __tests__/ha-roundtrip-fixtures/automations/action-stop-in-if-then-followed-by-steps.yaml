# `stop` inside `then`, with more steps after the `if`: stop ends the whole run, not just the branch.
id: fixture_stop_in_then
alias: Fixture - stop inside then followed by more steps
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - if:
      - condition: state
        entity_id: input_boolean.guest_mode
        state: "on"
    then:
      - action: persistent_notification.create
        data:
          message: Guest mode is on, doing nothing.
      - stop: Guest mode active.
  - action: light.turn_on
    target:
      entity_id: light.hallway
  - action: persistent_notification.create
    data:
      message: Not skipped when guest mode is off.
mode: single
