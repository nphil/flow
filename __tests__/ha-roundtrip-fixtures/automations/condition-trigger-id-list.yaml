# Root condition: automation continues for any of several trigger ids.
id: fixture_condition_trigger_ids
alias: Fixture - trigger condition id list
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
    id: door
  - trigger: time
    at: "22:00:00"
    id: bedtime
  - trigger: event
    event_type: manual_event
    id: manual
conditions:
  - condition: trigger
    id:
      - door
      - manual
actions:
  - action: light.turn_on
    target:
      entity_id: light.hallway
mode: single
