# `if` whose conditions are an `or` group containing an `and` and a `not`.
id: fixture_if_groups
alias: Fixture - if with condition groups
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - if:
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: state
                entity_id: binary_sensor.motion_a
                state: "on"
              - condition: state
                entity_id: binary_sensor.motion_b
                state: "on"
          - condition: not
            conditions:
              - condition: state
                entity_id: input_boolean.guest_mode
                state: "on"
    then:
      - action: light.turn_on
        target:
          entity_id: light.hallway
mode: single
