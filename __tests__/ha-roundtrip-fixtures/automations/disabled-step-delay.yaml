# A disabled delay: the steps around it run back to back.
id: fixture_disabled_delay
alias: Fixture - disabled delay
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - action: light.turn_on
    target:
      entity_id: light.hallway
  - enabled: false
    delay:
      minutes: 5
  - action: light.turn_off
    target:
      entity_id: light.hallway
mode: single
