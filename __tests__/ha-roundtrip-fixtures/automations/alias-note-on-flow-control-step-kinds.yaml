# Alias and note on choose (and its branch), if, repeat, parallel (and its branch), sequence and stop steps.
id: fixture_prose_flow_steps
alias: Fixture - alias and note on flow control steps
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - alias: Choose alias
    note: Choose note.
    choose:
      - alias: Choose branch alias
        note: Choose branch note.
        conditions:
          - condition: state
            entity_id: sun.sun
            state: below_horizon
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.hallway
    default:
      - action: light.turn_off
        target:
          entity_id: light.hallway
  - alias: If alias
    note: If note.
    if:
      - condition: state
        entity_id: input_boolean.guest_mode
        state: "on"
    then:
      - action: persistent_notification.create
        data:
          message: Guest.
  - alias: Repeat alias
    note: Repeat note.
    repeat:
      count: 2
      sequence:
        - action: light.toggle
          target:
            entity_id: light.hallway
  - alias: Parallel alias
    note: Parallel note.
    parallel:
      - alias: Parallel branch alias
        sequence:
          - action: notify.mobile_app_phone
            data:
              message: One.
      - action: notify.mobile_app_tablet
        data:
          message: Two.
  - alias: Sequence alias
    note: Sequence note.
    sequence:
      - action: persistent_notification.create
        data:
          message: Grouped.
  - alias: Stop alias
    note: Stop note.
    stop: Finished.
mode: single
