# choose nested inside a choose branch.
id: fixture_choose_nested
alias: Fixture - nested choose
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: sun.sun
            state: below_horizon
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: input_boolean.guest_mode
                    state: "on"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: light.living_room
            default:
              - action: light.turn_on
                target:
                  entity_id: light.hallway
    default:
      - action: persistent_notification.create
        data:
          message: Door opened in daylight.
mode: single
