# A disabled fire-event step between two enabled steps.
id: fixture_disabled_event
alias: Fixture - disabled event step
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - action: light.turn_on
    target:
      entity_id: light.hallway
  - enabled: false
    event: door_report
    event_data:
      source: front
  - action: persistent_notification.create
    data:
      message: Done.
mode: single
