# `choose` branch conditions written as one bare template string.
id: fixture_choose_template_string
alias: Fixture - choose with template string conditions
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - choose:
      - conditions: "{{ is_state('sun.sun', 'below_horizon') }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.hallway
      - conditions: >
          {{ states('sensor.room_a_temp') | float(0) > 30 and
             is_state('input_boolean.guest_mode', 'off') }}
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.fan
mode: single
