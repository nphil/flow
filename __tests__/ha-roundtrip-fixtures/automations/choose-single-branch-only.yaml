# choose with exactly one branch (an if without else).
id: fixture_choose_single_branch
alias: Fixture - choose single branch
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: sun.sun
            state: below_horizon
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.hallway
mode: single
