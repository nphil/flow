# choose with two branches and no default.
id: fixture_choose_no_default
alias: Fixture - choose without default
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: sun.sun
            state: below_horizon
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.hallway
      - conditions:
          - condition: state
            entity_id: input_boolean.guest_mode
            state: "on"
        sequence:
          - action: persistent_notification.create
            data:
              message: Guest at the door in daylight.
  - action: persistent_notification.create
    data:
      message: Runs after the choose in every case.
mode: single
