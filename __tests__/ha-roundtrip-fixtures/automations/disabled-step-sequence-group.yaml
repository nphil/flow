# A disabled nested sequence group between two enabled steps.
id: fixture_disabled_sequence
alias: Fixture - disabled sequence group
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - action: persistent_notification.create
    data:
      message: Before.
  - enabled: false
    alias: Optional extras
    sequence:
      - action: light.turn_on
        target:
          entity_id: light.hallway
      - delay:
          seconds: 5
  - action: persistent_notification.create
    data:
      message: After.
mode: single
