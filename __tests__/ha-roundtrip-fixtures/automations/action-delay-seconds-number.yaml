# Delay given as a bare number of seconds.
id: fixture_action_delay_number
alias: Fixture - delay seconds number
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - action: light.turn_on
    target:
      entity_id: light.hallway
  - delay: 5
  - action: light.turn_off
    target:
      entity_id: light.hallway
mode: single
