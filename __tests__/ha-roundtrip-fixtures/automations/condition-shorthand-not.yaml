# Root condition: `not:` shorthand.
id: fixture_condition_shorthand_not
alias: Fixture - not shorthand
triggers:
  - trigger: time
    at: "22:00:00"
conditions:
  - not:
      - condition: state
        entity_id: device_tracker.phone_a
        state: home
      - condition: state
        entity_id: alarm_control_panel.home
        state: disarmed
actions:
  - action: persistent_notification.create
    data:
      message: Nobody home and alarm armed.
mode: single
