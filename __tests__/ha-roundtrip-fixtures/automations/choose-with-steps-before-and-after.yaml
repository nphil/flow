# choose between ordinary steps: shared steps before and after the decision.
id: fixture_choose_surrounded
alias: Fixture - choose with steps before and after
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - action: persistent_notification.create
    data:
      message: Before the choose.
  - choose:
      - conditions:
          - condition: state
            entity_id: sun.sun
            state: below_horizon
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.hallway
    default:
      - action: light.turn_off
        target:
          entity_id: light.hallway
  - action: persistent_notification.create
    data:
      message: After the choose.
mode: single
