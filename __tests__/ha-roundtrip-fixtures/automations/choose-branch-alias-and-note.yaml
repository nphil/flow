# choose branches carry an alias and a note; the default has none.
id: fixture_choose_branch_prose
alias: Fixture - choose branch alias and note
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - choose:
      - alias: After dark - light the hallway
        note: Uses the sun entity, not the clock.
        conditions:
          - condition: state
            entity_id: sun.sun
            state: below_horizon
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.hallway
      - alias: Guests - just notify
        note: Guests are expected to ring the bell.
        conditions:
          - condition: state
            entity_id: input_boolean.guest_mode
            state: "on"
        sequence:
          - action: persistent_notification.create
            data:
              message: A guest is at the door.
    default:
      - action: persistent_notification.create
        data:
          message: Door opened during the day.
mode: single
