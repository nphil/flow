# `stop` inside one parallel branch.
id: fixture_stop_in_parallel
alias: Fixture - stop inside parallel branch
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - parallel:
      - sequence:
          - action: light.turn_on
            target:
              entity_id: light.hallway
          - stop: Branch finished the job.
      - sequence:
          - delay:
              seconds: 30
          - action: light.turn_off
            target:
              entity_id: light.hallway
mode: single
