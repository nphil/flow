# stop with `error: true` marks the run as failed.
id: fixture_stop_error
alias: Fixture - stop with error
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - if:
      - condition: state
        entity_id: input_boolean.guest_mode
        state: "unavailable"
    then:
      - stop: The guest helper is unavailable.
        error: true
  - action: light.turn_on
    target:
      entity_id: light.hallway
mode: single
