# A disabled service call between two enabled steps.
id: fixture_disabled_service
alias: Fixture - disabled service call
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - action: light.turn_on
    target:
      entity_id: light.hallway
  - enabled: false
    alias: Tell the phone
    action: notify.mobile_app_phone
    data:
      message: Door opened.
  - action: light.turn_off
    target:
      entity_id: light.hallway
mode: single
