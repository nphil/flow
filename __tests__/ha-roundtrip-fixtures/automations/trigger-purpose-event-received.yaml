# Purpose-specific trigger for an event entity receiving an event type.
id: fixture_trigger_purpose_event_received
alias: Fixture - purpose trigger event received
triggers:
  - trigger: event.received
    target:
      entity_id: event.remote_button
    options:
      event_type:
        - short_press
actions:
  - action: light.toggle
    target:
      entity_id: light.hallway
mode: single
