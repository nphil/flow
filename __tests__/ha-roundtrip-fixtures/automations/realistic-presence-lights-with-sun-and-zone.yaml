# Realistic: arrival lights using a zone trigger, sun condition and a parallel notification.
id: fixture_realistic_arrival
alias: Fixture - arrival lights
triggers:
  - trigger: zone
    entity_id: person.alex
    zone: zone.home
    event: enter
conditions:
  - condition: sun
    after: sunset
    after_offset: "-01:00:00"
actions:
  - parallel:
      - action: light.turn_on
        target:
          entity_id:
            - light.hallway
            - light.porch
        data:
          brightness_pct: 80
      - action: notify.mobile_app_tablet
        data:
          message: Alex arrived home.
mode: single
