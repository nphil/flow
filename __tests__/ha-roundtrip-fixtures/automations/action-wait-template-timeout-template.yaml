# wait_template whose timeout is a template.
id: fixture_wait_template_timeout_template
alias: Fixture - wait_template timeout template
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - wait_template: "{{ is_state('binary_sensor.entrance', 'on') }}"
    timeout: "{{ states('input_number.wait_seconds') | int(60) }}"
  - action: light.turn_on
    target:
      entity_id: light.hallway
mode: single
