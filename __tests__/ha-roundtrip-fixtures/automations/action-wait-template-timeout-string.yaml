# wait_template with an HH:MM:SS timeout (continue on timeout is the default).
id: fixture_wait_template_timeout_string
alias: Fixture - wait_template timeout string
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - wait_template: "{{ is_state('binary_sensor.entrance', 'on') }}"
    timeout: "00:01:00"
  - action: light.turn_on
    target:
      entity_id: light.hallway
mode: single
