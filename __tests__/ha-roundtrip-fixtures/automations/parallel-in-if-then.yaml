# parallel inside the then branch of an if.
id: fixture_parallel_in_if
alias: Fixture - parallel in if
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - if:
      - condition: state
        entity_id: sun.sun
        state: below_horizon
    then:
      - parallel:
          - action: light.turn_on
            target:
              entity_id: light.hallway
          - action: notify.mobile_app_phone
            data:
              message: Door opened after dark.
    else:
      - action: notify.mobile_app_phone
        data:
          message: Door opened.
mode: single
