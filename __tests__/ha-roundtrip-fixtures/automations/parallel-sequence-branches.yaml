# parallel whose branches are `sequence:` groups with several steps each.
id: fixture_parallel_sequences
alias: Fixture - parallel sequence branches
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - parallel:
      - sequence:
          - action: light.turn_on
            target:
              entity_id: light.hallway
          - delay:
              seconds: 60
          - action: light.turn_off
            target:
              entity_id: light.hallway
      - sequence:
          - action: notify.mobile_app_phone
            data:
              message: Door opened.
          - action: persistent_notification.create
            data:
              message: Door opened.
mode: single
