# Delay given as a quoted number of seconds.
id: fixture_action_delay_numeric_string
alias: Fixture - delay numeric string
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - action: light.toggle
    target:
      entity_id: light.hallway
  - delay: "5"
  - action: light.toggle
    target:
      entity_id: light.hallway
mode: single
