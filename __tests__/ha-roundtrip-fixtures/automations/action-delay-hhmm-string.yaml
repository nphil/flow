# Delay given as an HH:MM string.
id: fixture_action_delay_hhmm
alias: Fixture - delay HH:MM
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - action: light.turn_on
    target:
      entity_id: light.hallway
  - delay: "01:00"
  - action: light.turn_off
    target:
      entity_id: light.hallway
mode: single
