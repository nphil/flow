# A parallel inside a parallel branch, followed by a step that must run once after the inner pair.
id: fixture_parallel_nested
alias: Fixture - nested parallel
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - parallel:
      - sequence:
          - parallel:
              - action: light.turn_on
                target:
                  entity_id: light.hallway
              - action: light.turn_on
                target:
                  entity_id: light.porch
          - action: notify.mobile_app_tablet
            data:
              message: Both lights are on.
      - action: notify.mobile_app_phone
        data:
          message: Door opened.
mode: single
