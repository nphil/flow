# A variables step defining scalars and a list.
id: fixture_variables_step_scalars
alias: Fixture - variables step scalars
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - variables:
      greeting: Hello
      level: 40
      ratio: 0.5
      enabled: true
      rooms:
        - kitchen
        - hall
  - action: notify.mobile_app_phone
    data:
      message: "{{ greeting }} {{ rooms | join(' and ') }} at {{ level }}"
mode: single
