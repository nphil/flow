# `choose` branches whose conditions are long-form and shorthand groups.
id: fixture_choose_groups
alias: Fixture - choose with condition groups
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - choose:
      - conditions:
          - condition: or
            conditions:
              - condition: state
                entity_id: binary_sensor.motion_a
                state: "on"
              - condition: state
                entity_id: binary_sensor.motion_b
                state: "on"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.hallway
      - conditions:
          - not:
              - condition: state
                entity_id: input_boolean.guest_mode
                state: "on"
        sequence:
          - action: light.turn_off
            target:
              entity_id: light.hallway
mode: single
