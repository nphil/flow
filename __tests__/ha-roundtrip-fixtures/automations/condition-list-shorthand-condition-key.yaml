# Root condition written with a list under the `condition:` key (an implicit `and`).
id: fixture_condition_list_key
alias: Fixture - condition key holding a list
triggers:
  - trigger: time
    at: "22:00:00"
conditions:
  - condition:
      - condition: state
        entity_id: device_tracker.phone_a
        state: home
      - condition: numeric_state
        entity_id: sensor.room_a_temp
        below: 20
actions:
  - action: climate.turn_on
    target:
      entity_id: climate.living_room
mode: single
