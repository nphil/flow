# Service call whose target ids are templates.
id: fixture_action_target_templates
alias: Fixture - target templates
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - action: light.turn_on
    target:
      entity_id: "{{ 'light.hallway' if is_state('sun.sun', 'below_horizon') else 'light.porch' }}"
      area_id: "{{ states('input_select.active_area') }}"
mode: single
