# Service call with a data mapping (scalars, a list and a nested mapping).
id: fixture_action_service_data
alias: Fixture - action with data
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - action: light.turn_on
    target:
      entity_id: light.hallway
    data:
      brightness_pct: 60
      color_temp_kelvin: 3000
      transition: 2
      rgb_color:
        - 255
        - 200
        - 120
      extra:
        reason: door
        urgent: false
mode: single
