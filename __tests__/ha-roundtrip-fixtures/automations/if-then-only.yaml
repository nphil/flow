# if/then without an else.
id: fixture_if_then_only
alias: Fixture - if then only
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - if:
      - condition: state
        entity_id: sun.sun
        state: below_horizon
    then:
      - action: light.turn_on
        target:
          entity_id: light.hallway
  - action: persistent_notification.create
    data:
      message: Runs after the if either way.
mode: single
