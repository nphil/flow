# Delay given as an HH:MM:SS string.
id: fixture_action_delay_hhmmss
alias: Fixture - delay HH:MM:SS
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - action: light.turn_on
    target:
      entity_id: light.hallway
  - delay: "00:01:30"
  - action: light.turn_off
    target:
      entity_id: light.hallway
mode: single
