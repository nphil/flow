# choose with an explicit empty default.
id: fixture_choose_empty_default
alias: Fixture - choose empty default
triggers:
  - trigger: state
    entity_id: binary_sensor.front_door
    to: "on"
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: sun.sun
            state: below_horizon
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.hallway
    default: []
mode: single
