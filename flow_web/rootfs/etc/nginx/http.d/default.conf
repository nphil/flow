server {
    listen 80 default_server;
    server_name _;

    root /var/www/flow;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Hashed, content-addressed build output -- safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unmatched path resolves to index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
